name: tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        zig-version: [master]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install QEMU User-Mode
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user

          echo aarch64:
          qemu-aarch64 -version

          echo arm:
          qemu-arm -version

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: ${{ matrix.zig-version }}

      - name: Build and Test
        run: |
          make test
